<section class="newsletter">
  <div class="container">
    <h2 class="newsletter__title">Rejoignez notre communauté email</h2>
    <p class="newsletter__description">
      Restez informé des dernières actualités, événements et opportunités du réseau Alumni IUT Laval.
    </p>
    <form class="newsletter-form" aria-label="Formulaire d'inscription à la newsletter">
      <div class="newsletter-form__input-group">
        <input 
          type="email" 
          class="newsletter-form__input" 
          placeholder="Votre adresse email" 
          required
          aria-label="Adresse email"
        >
        <button type="submit" class="btn btn--secondary">S'inscrire</button>
      </div>
    </form>
  </div>
</section>
